name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify repository administrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require administrator permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')"
          if [[ "${permission}" != "admin" ]]; then
            printf 'Only repository administrators can run this workflow (permission: %s).\n' "${permission}" >&2
            exit 1
          fi

  source:
    name: Prepare source
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Package source
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: git archive --format=tar.gz --output=source.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-source-${{ github.run_id }}
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build without repository credentials
    needs: source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-source-${{ github.run_id }}

      - name: Unpack source
        run: tar --extract --gzip --file=source.tar.gz

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: ./scripts/build-static-site.sh

      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-site-${{ github.run_id }}
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Commit and push gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download deployment script
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-source-${{ github.run_id }}
          path: source

      - name: Unpack deployment script
        run: tar --extract --gzip --file=source/source.tar.gz

      - name: Download static site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-site-${{ github.run_id }}
          path: build

      - name: Deploy static site
        env:
          BUILD_DIR: ${{ github.workspace }}/build
          PAGES_REMOTE_URL: https://github.com/${{ github.repository }}.git
          PAGES_TOKEN: ${{ github.token }}
        run: ./scripts/deploy-gh-pages.sh
