name: Build static site

on:
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    name: Verify repository administrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require administrator permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')"
          if [[ "${permission}" != "admin" ]]; then
            printf 'Only repository administrators can run this workflow (permission: %s).\n' "${permission}" >&2
            exit 1
          fi

  source:
    name: Prepare source
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package source
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: git archive --format=tar.gz --output=source.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-source-${{ github.run_id }}
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build without repository credentials
    needs: source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-source-${{ github.run_id }}

      - name: Unpack source
        run: tar --extract --gzip --file=source.tar.gz

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: ./scripts/build-static-site.sh

      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: build
          if-no-files-found: error
          retention-days: 7
