name: Build static site

on:
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    name: Verify repository administrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require administrator permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')"
          if [[ "${permission}" != "admin" ]]; then
            printf 'Only repository administrators can run this workflow (permission: %s).\n' "${permission}" >&2
            exit 1
          fi

  source:
    name: Prepare source
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package source
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: git archive --format=tar.gz --output=source.tar.gz HEAD

      - name: Upload source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-source-${{ github.run_id }}
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build without repository credentials
    needs: source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site-source-${{ github.run_id }}

      - name: Unpack source
        run: tar --extract --gzip --file=source.tar.gz

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: ./scripts/build-static-site.sh

      - name: Upload static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-${{ github.run_id }}
          path: build
          if-no-files-found: error
          retention-days: 7
